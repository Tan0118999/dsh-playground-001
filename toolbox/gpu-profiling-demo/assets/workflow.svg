<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" font-family="DejaVu Sans, Noto Sans, sans-serif">
  <rect width="1120" height="500" fill="#ffffff"/>
  <text x="36" y="38" font-size="19" font-weight="bold" fill="#1f2d3d">A profiling loop that converges</text>
  <text x="36" y="60" font-size="12" fill="#607d8b">Start end-to-end. Go one level deeper only when the current level cannot answer the question.</text>
  <g>
    <rect x="36" y="90" width="190" height="250" rx="8" fill="#f4f8fd" stroke="#b9cfe8"/>
    <circle cx="62" cy="118" r="14" fill="#2f7ed8"/><text x="57" y="123" font-size="13" font-weight="bold" fill="#fff">1</text>
    <text x="84" y="124" font-size="13" font-weight="bold" fill="#1b4f72">End-to-end</text>
    <text x="52" y="158" font-size="11" fill="#455a64">Tool: nsys</text>
    <text x="52" y="176" font-size="11" fill="#455a64">(or torch profiler)</text>
    <line x1="52" y1="190" x2="210" y2="190" stroke="#d6e2ef"/>
    <text x="52" y="214" font-size="11.5" font-weight="bold" fill="#37474f">Question</text>
    <text x="52" y="234" font-size="11" fill="#546e7a">Where does wall time go?</text>
    <text x="52" y="252" font-size="11" fill="#546e7a">Which kernels / gaps / copies</text>
    <text x="52" y="270" font-size="11" fill="#546e7a">dominate? Is the GPU idle?</text>
    <text x="52" y="300" font-size="11.5" font-weight="bold" fill="#37474f">Output</text>
    <text x="52" y="320" font-size="11" fill="#546e7a">Top-5 kernels and their</text>
    <text x="52" y="336" font-size="11" fill="#546e7a">share of GPU time.</text>
  </g>
  <g>
    <rect x="252" y="90" width="190" height="250" rx="8" fill="#f4f8fd" stroke="#b9cfe8"/>
    <circle cx="278" cy="118" r="14" fill="#2f7ed8"/><text x="273" y="123" font-size="13" font-weight="bold" fill="#fff">2</text>
    <text x="300" y="124" font-size="13" font-weight="bold" fill="#1b4f72">One kernel</text>
    <text x="268" y="158" font-size="11" fill="#455a64">Tool: ncu</text>
    <text x="268" y="176" font-size="11" fill="#455a64">Speed Of Light section</text>
    <line x1="268" y1="190" x2="426" y2="190" stroke="#d6e2ef"/>
    <text x="268" y="214" font-size="11.5" font-weight="bold" fill="#37474f">Question</text>
    <text x="268" y="234" font-size="11" fill="#546e7a">Is it limited by memory,</text>
    <text x="268" y="252" font-size="11" fill="#546e7a">compute, or latency?</text>
    <text x="268" y="270" font-size="11" fill="#546e7a">How far from the roof?</text>
    <text x="268" y="300" font-size="11.5" font-weight="bold" fill="#37474f">Output</text>
    <text x="268" y="320" font-size="11" fill="#546e7a">Compute / memory % of</text>
    <text x="268" y="336" font-size="11" fill="#546e7a">peak, duration.</text>
  </g>
  <g>
    <rect x="468" y="90" width="190" height="250" rx="8" fill="#fff8f2" stroke="#ecc9ae"/>
    <circle cx="494" cy="118" r="14" fill="#e07b39"/><text x="489" y="123" font-size="13" font-weight="bold" fill="#fff">3</text>
    <text x="516" y="124" font-size="13" font-weight="bold" fill="#8a4b1f">Why exactly</text>
    <text x="484" y="158" font-size="11" fill="#455a64">Tool: ncu sections</text>
    <text x="484" y="176" font-size="11" fill="#455a64">(occupancy, stalls, source)</text>
    <line x1="484" y1="190" x2="642" y2="190" stroke="#f0d9c6"/>
    <text x="484" y="214" font-size="11.5" font-weight="bold" fill="#37474f">Question</text>
    <text x="484" y="234" font-size="11" fill="#546e7a">Which stall / access</text>
    <text x="484" y="252" font-size="11" fill="#546e7a">pattern / occupancy limit</text>
    <text x="484" y="270" font-size="11" fill="#546e7a">explains the gap?</text>
    <text x="484" y="300" font-size="11.5" font-weight="bold" fill="#37474f">Output</text>
    <text x="484" y="320" font-size="11" fill="#546e7a">One falsifiable hypothesis</text>
    <text x="484" y="336" font-size="11" fill="#546e7a">and a concrete change.</text>
  </g>
  <g>
    <rect x="684" y="90" width="190" height="250" rx="8" fill="#f2faf5" stroke="#b7dcc4"/>
    <circle cx="710" cy="118" r="14" fill="#3f9e7a"/><text x="705" y="123" font-size="13" font-weight="bold" fill="#fff">4</text>
    <text x="732" y="124" font-size="13" font-weight="bold" fill="#24604a">Verify</text>
    <text x="700" y="158" font-size="11" fill="#455a64">Tool: events + nsys</text>
    <text x="700" y="176" font-size="11" fill="#455a64">(same input, same build)</text>
    <line x1="700" y1="190" x2="858" y2="190" stroke="#d3e8db"/>
    <text x="700" y="214" font-size="11.5" font-weight="bold" fill="#37474f">Question</text>
    <text x="700" y="234" font-size="11" fill="#546e7a">Did the kernel and the</text>
    <text x="700" y="252" font-size="11" fill="#546e7a">end-to-end time improve?</text>
    <text x="700" y="270" font-size="11" fill="#546e7a">By how much, with variance?</text>
    <text x="700" y="300" font-size="11.5" font-weight="bold" fill="#37474f">Output</text>
    <text x="700" y="320" font-size="11" fill="#546e7a">Median / p95 before-after,</text>
    <text x="700" y="336" font-size="11" fill="#546e7a">not a single run.</text>
  </g>
  <g>
    <rect x="900" y="90" width="184" height="250" rx="8" fill="#f7f7f7" stroke="#cfcfcf"/>
    <circle cx="926" cy="118" r="14" fill="#607d8b"/><text x="921" y="123" font-size="13" font-weight="bold" fill="#fff">5</text>
    <text x="948" y="124" font-size="13" font-weight="bold" fill="#37474f">Guard</text>
    <text x="916" y="158" font-size="11" fill="#455a64">Tool: benchmark / CI</text>
    <text x="916" y="176" font-size="11" fill="#455a64">+ recorded baseline</text>
    <line x1="916" y1="190" x2="1072" y2="190" stroke="#e0e0e0"/>
    <text x="916" y="214" font-size="11.5" font-weight="bold" fill="#37474f">Question</text>
    <text x="916" y="234" font-size="11" fill="#546e7a">Does it hold on other</text>
    <text x="916" y="252" font-size="11" fill="#546e7a">shapes / GPUs / versions?</text>
    <text x="916" y="270" font-size="11" fill="#546e7a">Can it regress silently?</text>
    <text x="916" y="300" font-size="11.5" font-weight="bold" fill="#37474f">Output</text>
    <text x="916" y="320" font-size="11" fill="#546e7a">A baseline others can</text>
    <text x="916" y="336" font-size="11" fill="#546e7a">re-run.</text>
  </g>
  <!-- arrows -->
  <g stroke="#90a4ae" stroke-width="2" fill="#90a4ae">
    <line x1="226" y1="215" x2="246" y2="215"/><polygon points="246,209 254,215 246,221"/>
    <line x1="442" y1="215" x2="462" y2="215"/><polygon points="462,209 470,215 462,221"/>
    <line x1="658" y1="215" x2="678" y2="215"/><polygon points="678,209 686,215 678,221"/>
    <line x1="874" y1="215" x2="894" y2="215"/><polygon points="894,209 902,215 894,221"/>
  </g>
  <!-- bottom rules -->
  <rect x="36" y="370" width="1048" height="96" rx="8" fill="#f7f9fb" stroke="#dde3ea"/>
  <text x="56" y="398" font-size="12.5" font-weight="bold" fill="#37474f">Record at every step</text>
  <text x="56" y="421" font-size="11.5" fill="#546e7a">environment (GPU, driver, CUDA, tool version) · exact command · input shape/dtype · warmup and repetition · baseline metric · delta · what changed</text>
  <text x="56" y="446" font-size="11.5" fill="#546e7a">Change one variable at a time. If the profiler itself changes the number, say so and use a second measurement method (CUDA events / with and without profiler).</text>
  <text x="36" y="484" font-size="10" fill="#90a4ae">Schematic. The tools are interchangeable; the order is the point.</text>
</svg>
