<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="DejaVu Sans, Noto Sans, sans-serif">
  <rect width="1200" height="720" fill="#eef1f5"/>
  <rect x="16" y="14" width="1168" height="692" rx="8" fill="#ffffff" stroke="#b9c2cf"/>
  <!-- title bar -->
  <rect x="16" y="14" width="1168" height="34" rx="8" fill="#37474f"/>
  <rect x="16" y="34" width="1168" height="14" fill="#37474f"/>
  <text x="32" y="37" fill="#ffffff" font-size="14" font-weight="bold">NVIDIA Nsight Compute — report.ncu-rep</text>
  <text x="1080" y="37" fill="#cfd8dc" font-size="12">schematic</text>
  <!-- toolbar -->
  <rect x="16" y="48" width="1168" height="36" fill="#eceff1" stroke="#cfd8dc"/>
  <text x="34" y="72" font-size="12" fill="#37474f">Connect</text>
  <text x="104" y="72" font-size="12" fill="#37474f">Launch</text>
  <text x="166" y="72" font-size="12" fill="#37474f">Profile</text>
  <text x="232" y="72" font-size="12" fill="#37474f">Save</text>
  <text x="286" y="72" font-size="12" fill="#37474f">Import</text>
  <text x="1020" y="72" font-size="12" fill="#78909c">Filter: kernel name …</text>
  <!-- left navigation -->
  <rect x="16" y="84" width="238" height="622" fill="#f7f9fb" stroke="#cfd8dc"/>
  <text x="30" y="108" font-size="12" font-weight="bold" fill="#37474f">Report</text>
  <rect x="24" y="118" width="222" height="26" rx="4" fill="#dce8f5"/>
  <text x="36" y="136" font-size="12" fill="#1b4f72">Summary</text>
  <text x="36" y="164" font-size="12" fill="#455a64">Details</text>
  <text x="36" y="190" font-size="12" fill="#455a64">Source</text>
  <text x="36" y="216" font-size="12" fill="#455a64">Chart / Roofline</text>
  <line x1="24" y1="232" x2="246" y2="232" stroke="#cfd8dc"/>
  <text x="30" y="256" font-size="12" font-weight="bold" fill="#37474f">Sections</text>
  <g font-size="11.5" fill="#455a64">
    <text x="34" y="280">Speed Of Light</text>
    <text x="34" y="303">Compute Workload Analysis</text>
    <text x="34" y="326">Memory Workload Analysis</text>
    <text x="34" y="349">Occupancy</text>
    <text x="34" y="372">Scheduler Statistics</text>
    <text x="34" y="395">Warp State Statistics</text>
    <text x="34" y="418">Instruction Statistics</text>
    <text x="34" y="441">Launch Statistics</text>
    <text x="34" y="464">Source Counters</text>
  </g>
  <text x="30" y="500" font-size="11" fill="#90a4ae">Only the first four sections</text>
  <text x="30" y="516" font-size="11" fill="#90a4ae">are needed for a first pass.</text>
  <!-- main area -->
  <rect x="254" y="84" width="676" height="622" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="272" y="110" font-size="13" font-weight="bold" fill="#263238">GPU Speed Of Light Throughput</text>
  <text x="272" y="130" font-size="11" fill="#78909c">Duration 1.02 ms   SM frequency 2.4 GHz   Memory frequency 14 GHz</text>
  <!-- SOL bars -->
  <g>
    <text x="272" y="168" font-size="12" fill="#37474f">Compute (SM) Throughput</text>
    <rect x="470" y="157" width="300" height="16" rx="3" fill="#eceff1"/>
    <rect x="470" y="157" width="221" height="16" rx="3" fill="#ef8a3c"/>
    <text x="782" y="169" font-size="12" fill="#37474f">68 %</text>
    <text x="846" y="169" font-size="10" fill="#90a4ae">% of peak</text>
  </g>
  <g>
    <text x="272" y="200" font-size="12" fill="#37474f">Memory Throughput</text>
    <rect x="470" y="189" width="300" height="16" rx="3" fill="#eceff1"/>
    <rect x="470" y="189" width="75" height="16" rx="3" fill="#4f94cd"/>
    <text x="557" y="201" font-size="12" fill="#37474f">25 %</text>
    <text x="846" y="201" font-size="10" fill="#90a4ae">see breakdown</text>
  </g>
  <g font-size="11" fill="#607d8b">
    <text x="272" y="230">DRAM  22 %</text>
    <text x="384" y="230">L2  31 %</text>
    <text x="470" y="230">L1  54 %</text>
    <text x="560" y="230">Shared  12 %</text>
  </g>
  <line x1="272" y1="246" x2="912" y2="246" stroke="#e0e0e0"/>
  <!-- occupancy -->
  <text x="272" y="276" font-size="13" font-weight="bold" fill="#263238">Occupancy</text>
  <text x="272" y="300" font-size="12" fill="#37474f">Theoretical occupancy</text>
  <rect x="470" y="290" width="300" height="14" rx="3" fill="#eceff1"/>
  <rect x="470" y="290" width="150" height="14" rx="3" fill="#8bc34a"/>
  <text x="632" y="301" font-size="11" fill="#455a64">50 % (limited by registers)</text>
  <text x="272" y="326" font-size="12" fill="#37474f">Achieved occupancy</text>
  <rect x="470" y="316" width="300" height="14" rx="3" fill="#eceff1"/>
  <rect x="470" y="316" width="111" height="14" rx="3" fill="#aed581"/>
  <text x="592" y="327" font-size="11" fill="#455a64">37 %</text>
  <line x1="272" y1="346" x2="912" y2="346" stroke="#e0e0e0"/>
  <!-- warp state -->
  <text x="272" y="376" font-size="13" font-weight="bold" fill="#263238">Warp State Statistics — why warps are not issuing</text>
  <g font-size="10.5" fill="#455a64">
    <text x="272" y="402">long scoreboard (global memory)</text>
    <rect x="540" y="392" width="220" height="12" rx="2" fill="#ef8a3c"/>
    <text x="272" y="426">short scoreboard (shared memory)</text>
    <rect x="540" y="416" width="70" height="12" rx="2" fill="#ffb74d"/>
    <text x="272" y="450">math pipe throttle</text>
    <rect x="540" y="440" width="105" height="12" rx="2" fill="#4f94cd"/>
    <text x="272" y="474">not selected / eligible</text>
    <rect x="540" y="464" width="40" height="12" rx="2" fill="#90a4ae"/>
    <text x="272" y="498">barrier / wait</text>
    <rect x="540" y="488" width="25" height="12" rx="2" fill="#b0bec5"/>
  </g>
  <text x="540" y="520" font-size="10" fill="#90a4ae">bar length ∝ average warps stalled (illustrative, not data)</text>
  <line x1="272" y1="540" x2="912" y2="540" stroke="#e0e0e0"/>
  <text x="272" y="570" font-size="13" font-weight="bold" fill="#263238">Source Counters / SASS correlation</text>
  <g font-size="11" fill="#455a64">
    <text x="272" y="594">Sampling data attributes stall cycles to source lines and SASS instructions.</text>
    <text x="272" y="614">Open this only after SOL, occupancy and warp state point to a micro-level cause.</text>
  </g>
  <!-- right panel -->
  <rect x="940" y="84" width="244" height="622" fill="#fbfcfd" stroke="#cfd8dc"/>
  <text x="956" y="108" font-size="12" font-weight="bold" fill="#37474f">Details / Rules</text>
  <rect x="954" y="120" width="216" height="94" rx="4" fill="#fff8e1" stroke="#ffe082"/>
  <text x="966" y="142" font-size="11" font-weight="bold" fill="#8d6e63">Rule: Occupancy</text>
  <text x="966" y="162" font-size="10.5" fill="#6d4c41">Theoretical occupancy is</text>
  <text x="966" y="178" font-size="10.5" fill="#6d4c41">limited by registers/thread.</text>
  <text x="966" y="194" font-size="10.5" fill="#6d4c41">Try __launch_bounds__</text>
  <text x="966" y="210" font-size="10.5" fill="#6d4c41">or fewer live values.</text>
  <rect x="954" y="226" width="216" height="78" rx="4" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="966" y="248" font-size="11" font-weight="bold" fill="#2e7d32">Rule: Memory</text>
  <text x="966" y="268" font-size="10.5" fill="#33691e">Uncoalesced global accesses:</text>
  <text x="966" y="284" font-size="10.5" fill="#33691e">raise sectors/request.</text>
  <text x="956" y="336" font-size="11" fill="#78909c">Rules are suggestions from</text>
  <text x="956" y="352" font-size="11" fill="#78909c">the profiler, not a verdict.</text>
  <!-- callout badges -->
  <g font-size="13" font-weight="bold">
    <circle cx="238" cy="252" r="12" fill="#d35400"/><text x="233" y="257" fill="#fff">2</text>
    <circle cx="252" cy="150" r="12" fill="#d35400"/><text x="247" y="155" fill="#fff">4</text>
    <circle cx="600" cy="150" r="12" fill="#d35400"/><text x="595" y="155" fill="#fff">1</text>
    <circle cx="800" cy="277" r="12" fill="#d35400"/><text x="795" y="282" fill="#fff">3</text>
    <circle cx="930" cy="386" r="12" fill="#d35400"/><text x="925" y="391" fill="#fff">5</text>
    <circle cx="1100" cy="115" r="12" fill="#d35400"/><text x="1095" y="120" fill="#fff">6</text>
  </g>
  <text x="16" y="714" font-size="10" fill="#90a4ae">Structural schematic, not a screenshot. Layout and values vary; bars and rules are illustrative.</text>
</svg>
