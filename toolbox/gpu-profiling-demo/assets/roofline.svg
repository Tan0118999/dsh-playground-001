<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="DejaVu Sans, Noto Sans, sans-serif">
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="40" y="36" font-size="18" font-weight="bold" fill="#1f2d3d">Roofline: what the hardware can give you</text>
  <text x="40" y="58" font-size="12" fill="#607d8b">RTX 5070: 672 GB/s HBM, 30.9 TFLOP/s FP32 (spec sheet). Throughput is measured; the matmul x-position uses its ideal AI (real reuse is worse).</text>
  <rect x="100" y="80" width="840" height="470" fill="#fbfcfd" stroke="#cfd8dc"/>
  <!-- memory-bound region under diagonal -->
  <polygon points="100,550 129.0,550 715.3,139.9 715.3,550" fill="#e8f1fa"/>
  <!-- compute-bound region under compute roof, right of ridge -->
  <polygon points="715.3,139.9 940,139.9 940,550 715.3,550" fill="#fdf1e6"/>
  <!-- grid -->
  <g stroke="#e3e8ee" stroke-width="1">
    <line x1="100" y1="550.0" x2="940" y2="550.0"/>
    <line x1="100" y1="432.5" x2="940" y2="432.5"/>
    <line x1="100" y1="315.0" x2="940" y2="315.0"/>
    <line x1="100" y1="197.5" x2="940" y2="197.5"/>
    <line x1="100" y1="80.0" x2="940" y2="80.0"/>
    <line x1="100.0" y1="80" x2="100.0" y2="550"/>
    <line x1="268.0" y1="80" x2="268.0" y2="550"/>
    <line x1="436.0" y1="80" x2="436.0" y2="550"/>
    <line x1="604.0" y1="80" x2="604.0" y2="550"/>
    <line x1="772.0" y1="80" x2="772.0" y2="550"/>
    <line x1="940.0" y1="80" x2="940.0" y2="550"/>
  </g>
  <line x1="129.0" y1="550" x2="715.3" y2="139.9" stroke="#2f7ed8" stroke-width="3"/>
  <line x1="715.3" y1="139.9" x2="940" y2="139.9" stroke="#e07b39" stroke-width="3"/>
  <g font-size="11" fill="#607d8b" text-anchor="end">
    <text x="88" y="554.0">10</text>
    <text x="88" y="436.5">100</text>
    <text x="88" y="319.0">1k</text>
    <text x="88" y="201.5">10k</text>
    <text x="88" y="84.0">100k</text>
  </g>
  <g font-size="11" fill="#607d8b" text-anchor="middle">
    <text x="100.0" y="572">0.01</text>
    <text x="268.0" y="572">0.1</text>
    <text x="436.0" y="572">1</text>
    <text x="604.0" y="572">10</text>
    <text x="772.0" y="572">100</text>
    <text x="940.0" y="572">1000</text>
  </g>
  <text x="30" y="320" font-size="12" fill="#37474f" transform="rotate(-90 30 320)">Attainable performance (GFLOP/s)</text>
  <text x="520" y="602" font-size="12" fill="#37474f" text-anchor="middle">Arithmetic intensity (FLOP / Byte)</text>
  <text x="330" y="535" font-size="14" fill="#2f7ed8" font-weight="bold">memory-bound</text>
  <text x="850" y="180" font-size="14" fill="#c9662a" font-weight="bold">compute-bound</text>
  <text x="640" y="410" font-size="13" fill="#7f8c8d" font-weight="bold">below the roofs</text>
  <text x="640" y="428" font-size="10.5" fill="#95a5a6">headroom, not yet a diagnosis</text>
  <text x="300" y="330" font-size="12" fill="#2f7ed8" transform="rotate(-34 300 330)">HBM roof = 672 GB/s</text>
  <text x="727.3" y="131.9" font-size="12" fill="#c9662a">FP32 compute roof = 30.9 TFLOP/s</text>
  <circle cx="254.7" cy="469.6" r="7" fill="#2f7ed8" stroke="#ffffff" stroke-width="2"/>
  <text x="268.7" y="465.6" font-size="11" fill="#1b4f72" font-weight="bold">vector_add (measured)</text>
  <text x="268.7" y="481.6" font-size="10" fill="#36648b">AI 0.083, 580 GB/s = 48 GFLOP/s</text>
  <text x="268.7" y="495.6" font-size="10" fill="#36648b">86% of the bandwidth roof: almost no headroom</text>
  <circle cx="811.0" cy="277.1" r="7" fill="#e07b39" stroke="#ffffff" stroke-width="2"/>
  <line x1="811.0" y1="139.9" x2="811.0" y2="268.1" stroke="#e07b39" stroke-width="1.3" stroke-dasharray="5 4"/>
  <line x1="805.0" y1="275.1" x2="751.0" y2="222.1" stroke="#e07b39" stroke-width="1"/>
  <text x="741.0" y="197.1" font-size="11" fill="#a35422" font-weight="bold" text-anchor="end">naive matmul (measured 2.1 TFLOP/s)</text>
  <text x="741.0" y="213.1" font-size="10" fill="#b06a3a" text-anchor="end">ideal AI = N/6 ≈ 171, 6.8% of FP32 peak</text>
  <text x="741.0" y="228.1" font-size="10" fill="#b06a3a" text-anchor="end">the gap is real; ncu tells you why</text>
  <rect x="610" y="452" width="320" height="86" rx="6" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="626" y="476" font-size="12" font-weight="bold" fill="#37474f">Arithmetic intensity</text>
  <text x="626" y="498" font-size="12" fill="#37474f">AI = FLOPs / Bytes moved</text>
  <text x="626" y="520" font-size="10.5" fill="#607d8b">machine balance = 30 900 / 672 ≈ 46 FLOP/Byte</text>
  <text x="626" y="534" font-size="10.5" fill="#607d8b">AI &lt; 46 → bandwidth-bound; AI &gt; 46 → compute-bound</text>
  <text x="40" y="640" font-size="10" fill="#90a4ae">Roofline is a bound, not a prediction. For irregular reuse, measure bytes with Nsight Compute instead of assuming ideal AI.</text>
</svg>
